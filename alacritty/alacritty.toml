[window]
decorations = "None"

[font]
size = 12
normal = { family = "SauceCodePro Nerd Font Mono", style = "Medium" }
bold = { family = "SauceCodePro Nerd Font Mono", style = "Bold" }
italic = { family = "SauceCodePro Nerd Font Mono", style = "Italic" }
bold_italic = { family = "SauceCodePro Nerd Font Mono", style = "Bold Italic" }

[mouse]
hide_when_typing = true

[keyboard]
bindings = [
    { key = "N", mods = "Control|Shift", action = "CreateNewWindow" },
    { key = "F11", mods = "Control|Shift", action = "ToggleFullscreen" },
]

